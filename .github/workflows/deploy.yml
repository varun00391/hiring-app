# Deploy HireBot to an Azure VM (or any host) over SSH: git pull + docker compose.
#
# Prerequisites on the server
# - Repo cloned at DEPLOY_PATH (e.g. /home/azureuser/hirebot)
# - Root `.env` present with production values (CORS_ORIGINS, NEXT_PUBLIC_API_URL, SECRET_KEY, …)
# - Docker + Docker Compose v2; deploy user in `docker` group
# - Git remote usable from the VM (public repo, or deploy key / credentials already configured on the VM)
#
# GitHub repository configuration
# - Secrets: DEPLOY_HOST, DEPLOY_USER, SSH_PRIVATE_KEY (PEM contents for the VM user)
# - Optional repository variable: DEPLOY_PATH (default below is used if unset)
#
name: Deploy

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Git branch to deploy on the VM"
        required: false
        default: main
  push:
    branches:
      - main

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy via SSH
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Optional: add `environment: production` once a GitHub Environment exists (enables required reviewers).

    env:
      DEPLOY_BRANCH: ${{ inputs.branch || github.ref_name }}
      # Repository variable DEPLOY_PATH; adjust default if your clone path differs.
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/home/azureuser/hirebot' }}

    steps:
      - name: Deploy on remote host
        uses: appleboy/ssh-action@v1.2.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 40m
          script_stop: true
          script: |
            set -euo pipefail
            cd "${{ env.DEPLOY_PATH }}"
            test -f .env || { echo "Missing .env in repo root on server; create from .env.example." >&2; exit 1; }
            git fetch origin "${{ env.DEPLOY_BRANCH }}"
            git checkout "${{ env.DEPLOY_BRANCH }}"
            git reset --hard "origin/${{ env.DEPLOY_BRANCH }}"
            docker compose build --no-cache frontend
            docker compose up -d --build
            docker compose ps
