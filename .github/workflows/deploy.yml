# Deploy HireBot to an Azure VM (or any host) over SSH: git pull + docker compose.
#
# Prerequisites on the server
# - Repo cloned at DEPLOY_PATH (e.g. /home/azureuser/hiring-app)
# - Root `.env` present with production values (CORS_ORIGINS, NEXT_PUBLIC_API_URL, SECRET_KEY, …)
# - Docker + Docker Compose v2; deploy user in `docker` group
# - Git remote usable from the VM (public repo, or deploy key / credentials already configured on the VM)
#
# GitHub repository configuration
# - Secrets: DEPLOY_HOST, DEPLOY_USER, SSH_PRIVATE_KEY (PEM contents for the VM user)
# - Path on the VM that contains docker-compose.yml and .env (must exist before deploy):
#   - Set repository variable DEPLOY_PATH, OR pass "deploy_path" on manual runs, OR fix the default below.
# - If you see: cd: ... No such file or directory → SSH to the VM, cd into your clone, run `pwd`,
#   and set DEPLOY_PATH to that absolute path (Linux paths are case-sensitive).
#
name: Deploy

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Git branch to deploy on the VM"
        required: false
        default: main
      deploy_path:
        description: "Absolute path to repo on VM (leave empty to use variable / default)"
        required: false
        default: ""
  push:
    branches:
      - main

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy via SSH
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Optional: add `environment: production` once a GitHub Environment exists (enables required reviewers).

    env:
      DEPLOY_BRANCH: ${{ inputs.branch || github.ref_name }}
      # Manual input overrides Actions variable; default matches typical Azure VM clone path.
      DEPLOY_PATH: ${{ inputs.deploy_path || vars.DEPLOY_PATH || '/home/azureuser/hiring-app' }}

    steps:
      - name: Deploy on remote host
        uses: appleboy/ssh-action@v1.2.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 40m
          script_stop: true
          script: |
            set -euo pipefail
            echo "Using DEPLOY_PATH=${{ env.DEPLOY_PATH }}"
            if [ ! -d "${{ env.DEPLOY_PATH }}" ]; then
              echo "Directory does not exist on the VM: ${{ env.DEPLOY_PATH }}" >&2
              echo "Set GitHub variable DEPLOY_PATH to the output of 'pwd' inside your clone, or pass deploy_path when running manually." >&2
              exit 1
            fi
            cd "${{ env.DEPLOY_PATH }}"
            test -f docker-compose.yml || { echo "No docker-compose.yml here; DEPLOY_PATH is wrong." >&2; exit 1; }
            test -f .env || { echo "Missing .env in repo root on server; create from .env.example." >&2; exit 1; }
            git fetch origin "${{ env.DEPLOY_BRANCH }}"
            git checkout "${{ env.DEPLOY_BRANCH }}"
            git reset --hard "origin/${{ env.DEPLOY_BRANCH }}"
            docker compose build --no-cache frontend
            docker compose up -d --build
            docker compose ps
