services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: hirebot
      POSTGRES_PASSWORD: hirebot
      POSTGRES_DB: hirebot
    ports:
      - "5432:5432"
    volumes:
      - hirebot_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hirebot -d hirebot"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    environment:
      # Root `.env` (from `.env.example`) supplies these via Compose interpolation.
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://hirebot:hirebot@db:5432/hirebot}
      SECRET_KEY: ${SECRET_KEY:-replace-with-long-random-secret}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-1440}
      UPLOAD_DIR: ${UPLOAD_DIR:-/data/uploads}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-10}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      UNIFY_DEMO_PASSWORDS: ${UNIFY_DEMO_PASSWORDS:-true}
    volumes:
      - hirebot_uploads:/data/uploads
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      args:
        # Baked in at image build time — set in .env for cloud VMs, then: docker compose build --no-cache frontend
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000/api/v1}
    environment:
      PORT: "3000"
      HOSTNAME: 0.0.0.0
    depends_on:
      - backend
    ports:
      - "3000:3000"

volumes:
  hirebot_pg:
  hirebot_uploads:
